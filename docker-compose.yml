services:
  db:
    image: mysql:8.4
    container_name: gemlot-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gemlot
      MYSQL_USER: gemlot
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
